[package]
name = "untab"
version = "0.4.0"
description = "Uma biblioteca local de links, notas e arquivos"
license = "MIT"
repository = "https://github.com/kiocos/untab"
authors = ["Caio <c@bol.tz>"]
edition = "2021"
rust-version = "1.90"
default-run = "untab"

[lib]
name = "untab_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
smoke-test = []

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "stream"] }
scraper = "0.24"
tokio = { version = "1", features = ["sync", "net", "time", "macros", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha2 = "0.11"
zip = { version = "6", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSData"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
