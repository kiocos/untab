name: Build release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
            args: ''
          - os: ubuntu-22.04
            name: linux
            args: ''
          - os: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify package versions
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/check-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-version.mjs
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: rustup toolchain install stable --profile minimal
      - name: Universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: release-${{ matrix.name }}
      - run: npm ci
      - name: Build signed update artifacts
        run: npm run bundle -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./qa/windows-installer.ps1
      - name: Collect release files
        run: node scripts/collect-artifacts.mjs
      - name: Record Linux runtime packages
        if: runner.os == 'Linux'
        run: dpkg-query -W > release-artifacts/linux-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
